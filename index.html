<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Studio — your white-label QR generator</title>
<meta name="description" content="Create branded QR codes for your business: static and dynamic, with scan analytics, branding and custom domains.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%97%B5%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="QR Studio — white-label QR generator">
<meta property="og:description" content="Branded, dynamic QR codes with analytics for your business.">
<meta name="theme-color" content="#0A0A0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="center">
  <div class="auth-card">
    <div class="logo">◵ QR Studio</div>
    <p class="muted" style="margin:8px 0 0;font-size:14px">Build your company's QR engine. Dynamic, branded, unlimited.</p>

    <div class="tabs-auth">
      <button id="tabLogin" class="active">Sign in</button>
      <button id="tabSignup">Sign up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" required></div>
      <button type="submit" style="width:100%">Sign in</button>
      <button type="button" id="resendLogin" class="btn-ghost hidden" style="width:100%;margin-top:8px">Resend confirmation email</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="hidden">
      <div class="field"><label>Company name</label><input type="text" id="suCompany" placeholder="e.g. Acme Inc." required></div>
      <div class="field"><label>Email</label><input type="email" id="suEmail" required></div>
      <div class="field"><label>Password (min 6)</label><input type="password" id="suPass" minlength="6" required></div>
      <button type="submit" style="width:100%">Create my account</button>
      <button type="button" id="resendSignup" class="btn-ghost hidden" style="width:100%;margin-top:8px">Resend confirmation email</button>
      <div class="msg" id="suMsg"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
const sb = supabase.createClient(QR_CONFIG.SUPABASE_URL, QR_CONFIG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const redirectTo = `${location.origin}/index.html`;
let lastSignupEmail = '';

// redirect if already logged in
sb.auth.getSession().then(({data})=>{ if(data.session) location.href='app.html'; });

function showMsg(id, text, ok = false) {
  const m = $(id); m.className = ok ? 'msg ok' : 'msg err'; m.textContent = text;
}

async function busy(btn, label, fn) {
  if (!btn || btn.disabled) return;
  const prev = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); }
  finally { btn.disabled = false; btn.textContent = prev; }
}

function authMessage(error) {
  const msg = (error && error.message ? error.message : '').toLowerCase();
  if (msg.includes('email not confirmed') || msg.includes('not confirmed')) {
    return 'Email not confirmed yet. Check your inbox or resend the confirmation email.';
  }
  if (msg.includes('invalid login') || msg.includes('invalid credentials')) {
    return 'Email or password is not correct.';
  }
  if (msg.includes('already registered') || msg.includes('already exists')) {
    return 'This email is already registered. Sign in or resend the confirmation email.';
  }
  if (msg.includes('rate limit') || msg.includes('too many')) {
    return 'Too many attempts. Wait a moment, then try again.';
  }
  return error && error.message ? error.message : 'Authentication failed. Please try again.';
}

function showLogin() {
  $('tabLogin').classList.add('active'); $('tabSignup').classList.remove('active');
  $('loginForm').classList.remove('hidden'); $('signupForm').classList.add('hidden');
}

function showSignup() {
  $('tabSignup').classList.add('active'); $('tabLogin').classList.remove('active');
  $('signupForm').classList.remove('hidden'); $('loginForm').classList.add('hidden');
}

$('tabLogin').onclick = showLogin;
$('tabSignup').onclick = showSignup;

$('loginForm').onsubmit=async e=>{
  e.preventDefault(); const btn=e.submitter; const m=$('loginMsg'); m.className='msg'; m.textContent='Signing in...';
  return busy(btn, 'Signing in...', async () => {
    const email = $('loginEmail').value.trim();
    const {error}=await sb.auth.signInWithPassword({email,password:$('loginPass').value});
    if(error){
      if ((error.message || '').toLowerCase().includes('confirm')) {
        lastSignupEmail = email; $('suEmail').value = email; $('resendLogin').classList.remove('hidden');
      }
      showMsg('loginMsg', authMessage(error)); return;
    }
    location.href='app.html';
  });
};

$('signupForm').onsubmit=async e=>{
  e.preventDefault(); const btn=e.submitter; const m=$('suMsg'); m.className='msg'; m.textContent='Creating account...';
  return busy(btn, 'Creating account...', async () => {
    const email = $('suEmail').value.trim();
    const company = $('suCompany').value.trim();
    lastSignupEmail = email;
    const {data,error}=await sb.auth.signUp({
      email, password:$('suPass').value,
      options:{ data:{ company_name: company }, emailRedirectTo: redirectTo }
    });
    if(error){ $('resendSignup').classList.remove('hidden'); showMsg('suMsg', authMessage(error)); return; }
    if(data.session){ location.href='app.html'; return; }
    $('resendSignup').classList.remove('hidden');
    m.className='msg ok';
    m.textContent='Account request accepted. Check your email, confirm the account, then sign in.';
  });
};

async function resendConfirmation(btn, msgId) {
  const email = ($('suEmail').value || lastSignupEmail || $('loginEmail').value).trim();
  if (!email) { showMsg(msgId, 'Enter your email first.'); return; }
  return busy(btn, 'Sending...', async () => {
    const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: redirectTo } });
    if (error) { showMsg(msgId, authMessage(error)); return; }
    showMsg(msgId, 'Confirmation email sent. Check your inbox and spam folder.', true);
  });
}

$('resendLogin').onclick = function () { return resendConfirmation(this, 'loginMsg'); };
$('resendSignup').onclick = function () { return resendConfirmation(this, 'suMsg'); };
</script>
</body>
</html>
